<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a1c" />
<title>SolarFlow</title>
<style>
  :root{
    --amber:#ffb020; --coral:#ff6b4a; --violet:#7b5cff; --teal:#12c6a5; --sky:#3aa0ff; --pink:#ff5ea8;
    --ink:#eef1ff; --muted:rgba(238,241,255,.62); --card:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.10); --ok:#12c6a5; --warn:#ffb020; --err:#ff5d5d;
    --accent:var(--violet);
    --r-lg:26px; --r-md:18px; --r-sm:12px;
    --shadow:0 18px 50px rgba(3,6,20,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1100px 600px at 8% -12%,#26306f 0%,transparent 55%),
      radial-gradient(900px 620px at 100% 0%,rgba(18,198,165,.16) 0%,transparent 50%),
      radial-gradient(800px 700px at 60% 110%,rgba(123,92,255,.20) 0%,transparent 55%),
      #070a1c;
    background-attachment:fixed; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* weiche, langsam wandernde Lichtblasen im Hintergrund */
  .aura{position:fixed;inset:-20% -20% auto -20%;height:70vh;pointer-events:none;z-index:-1;filter:blur(70px);opacity:.55}
  .aura span{position:absolute;width:34vw;height:34vw;border-radius:50%;mix-blend-mode:screen;animation:float 22s ease-in-out infinite}
  .aura span:nth-child(1){left:4%;background:rgba(255,176,32,.45);animation-delay:0s}
  .aura span:nth-child(2){left:38%;background:rgba(18,198,165,.42);animation-delay:-7s}
  .aura span:nth-child(3){left:70%;background:rgba(123,92,255,.42);animation-delay:-14s}
  @keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4vw,4vh,0) scale(1.12)}}
  .wrap{max-width:1140px;margin:0 auto;padding:18px 16px 72px}
  header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{font-size:27px;width:56px;height:56px;border-radius:19px;display:grid;place-items:center;position:relative;
    background:linear-gradient(135deg,var(--amber),var(--coral));box-shadow:0 12px 34px rgba(255,140,60,.4)}
  .logo::after{content:"";position:absolute;inset:0;border-radius:19px;box-shadow:0 0 0 0 rgba(255,176,32,.55);animation:halo 3.4s ease-out infinite}
  @keyframes halo{0%{box-shadow:0 0 0 0 rgba(255,176,32,.5)}70%{box-shadow:0 0 0 22px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
  h1{margin:0;font-size:25px;letter-spacing:.4px}
  .sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .hact{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{cursor:pointer;border:none;border-radius:var(--r-sm);font:inherit;padding:10px 15px;color:var(--ink);
    background:var(--card);transition:transform .12s ease,filter .2s,box-shadow .2s}
  button:hover{filter:brightness(1.13)} button:active{transform:scale(.96)}
  .ghost{background:rgba(255,255,255,.08)}
  .danger{background:linear-gradient(135deg,#ff5d5d,#c22);font-weight:700}
  .danger.pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,.6)}50%{box-shadow:0 0 0 12px rgba(255,80,80,0)}}
  .conn{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:6px}
  .conn.on{background:rgba(18,198,165,.2);color:#6ef2d6}
  .conn.off{background:rgba(255,93,93,.2);color:#ffb3ab}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 2.4s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  .hero{margin-top:20px;display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:22px;
    background:linear-gradient(135deg,rgba(255,176,32,.10),rgba(123,92,255,.14));
    border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);
    transform:translateX(-100%);animation:sheen 7s ease-in-out infinite}
  @keyframes sheen{0%,60%{transform:translateX(-100%)}80%,100%{transform:translateX(100%)}}
  .gauge{position:relative;display:grid;place-items:center}
  .gauge svg{width:100%;display:block}
  .track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:14;stroke-linecap:round}
  .fill{fill:none;stroke:url(#sunGrad);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
  .gval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .gval strong{font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
  .gval span{font-size:13px;color:var(--muted)} .gval em{font-style:normal;font-size:11.5px;color:var(--muted);margin-top:5px}
  .pulse-ring{position:absolute;width:70%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,176,32,.35);
    animation:ring 3s ease-out infinite;pointer-events:none}
  @keyframes ring{0%{transform:scale(.75);opacity:.7}100%{transform:scale(1.15);opacity:0}}
  .hinfo{display:flex;flex-direction:column;gap:12px;min-width:0}
  .chip{align-self:flex-start;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13.5px}
  .chip.normal{background:rgba(18,198,165,.2);color:#6ef2d6}
  .chip.boost{background:rgba(255,176,32,.22);color:#ffd27a}
  .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:13.5px}
  .row span{color:var(--muted)}
  .why{font-size:13px;background:rgba(255,255,255,.05);padding:10px 12px;border-radius:var(--r-sm);line-height:1.4}
  .modes{display:flex;gap:9px;margin-top:4px;flex-wrap:wrap}
  .mode{flex:1;min-width:120px;text-align:left;background:rgba(255,255,255,.06);padding:11px 12px;position:relative;overflow:hidden}
  .mode b{display:block;font-size:14.5px}.mode small{color:var(--muted);font-size:11px}
  .mode.sel{background:linear-gradient(135deg,var(--amber),var(--coral));color:#241300;box-shadow:0 10px 26px rgba(255,140,60,.35)}
  .mode.sel small{color:rgba(36,19,0,.75)}
  .mode::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:transparent;transition:background .2s}
  .mode.sel::after{background:rgba(255,255,255,.55)}

  /* Energiefluss-Vergleich */
  .flow{display:grid;gap:10px}
  .fnode{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;
    background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
  .fico{font-size:20px;text-align:center}
  .fbar{height:9px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
  .fbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.7));
    width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
  .fval{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
  .fsub{font-size:11px;color:var(--muted)}
  .selfuse{display:flex;align-items:center;gap:12px;margin-top:6px;padding:12px 14px;border-radius:var(--r-md);
    background:linear-gradient(135deg,rgba(18,198,165,.16),rgba(123,92,255,.16));border:1px solid rgba(18,198,165,.3)}
  .ring{--p:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:conic-gradient(var(--teal) calc(var(--p)*1%),rgba(255,255,255,.12) 0);position:relative}
  .ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#0b0f28}
  .ring b{position:relative;font-size:13px}

  .tabs{display:flex;gap:8px;margin:22px 0 12px;flex-wrap:wrap}
  .tab{background:rgba(255,255,255,.06)}
  .tab.sel{background:linear-gradient(135deg,var(--violet),var(--teal));color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(90,70,220,.35)}
  h2{font-size:15.5px;margin:22px 0 10px;color:rgba(238,241,255,.92);display:flex;align-items:center;gap:9px}
  h2 .cnt{font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:999px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}

  .layer{display:grid;grid-template-columns:32px 1fr auto;gap:4px 10px;align-items:center;
    background:var(--card);border-radius:14px;padding:10px 12px;border-left:4px solid #4a5580;
    transition:transform .16s ease,border-color .3s}
  .layer:hover{transform:translateY(-2px)}
  .layer.ok{border-left-color:var(--ok)}.layer.warn{border-left-color:var(--warn)}
  .layer.blocked{border-left-color:var(--err)}.layer.active{border-left-color:var(--violet)}
  .idx{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:12px}
  .lname{font-weight:600;font-size:13.5px}
  .lstat{font-size:11px;color:var(--muted)}
  .ldet{grid-column:2/-1;font-size:11.5px;color:var(--muted)}
  ol.steps{margin:0;padding-left:20px;font-size:13px}
  ol.steps li{margin:5px 0} ol.steps li.s-warn{color:#ffd27a} ol.steps li.s-blocked{color:#ff9b8a}

  .card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid rgba(255,255,255,.08);
    border-radius:var(--r-md);padding:13px;transition:transform .16s ease,border-color .25s,box-shadow .25s}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
  .card.on{background:linear-gradient(135deg,rgba(18,198,165,.14),rgba(123,92,255,.14));border-color:rgba(18,198,165,.4)}
  .cico{font-size:21px}.cbody{flex:1}.ctitle{font-weight:700;display:flex;align-items:center;gap:8px;font-size:13.5px}
  .badge{font-size:9.5px;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:999px}
  .csum{font-size:12px;color:rgba(238,241,255,.8);margin-top:4px;line-height:1.35}
  .creason{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
  .sw{position:relative;width:44px;height:25px;flex:none}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:rgba(255,255,255,.2);border-radius:999px;transition:.22s}
  .sw span::before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.22s}
  .sw input:checked+span{background:linear-gradient(135deg,var(--teal),var(--violet))}
  .sw input:checked+span::before{transform:translateX(19px)}
  .sw input:disabled+span{opacity:.4}

  .sgroup{margin:13px 0;padding:14px 16px;border-radius:var(--r-md);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
  .sgroup h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
  .srow{display:grid;grid-template-columns:230px 1fr 84px;gap:12px;align-items:center;margin:8px 0}
  .srow label{font-size:13px;color:rgba(238,241,255,.9)}
  .srow output{text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{accent-color:var(--amber);width:100%}
  .primary{margin-top:16px;background:linear-gradient(135deg,var(--teal),var(--violet));color:#fff;font-weight:700;padding:12px 18px}
  .srcline{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:center;margin:9px 0}
  .srcline label{font-size:13px}
  select,input[type=text],input[type=number]{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--ink);font:inherit}
  select:focus,input:focus{outline:2px solid rgba(123,92,255,.5);outline-offset:1px}
  .src{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;background:rgba(255,255,255,.04);padding:8px 10px;border-radius:10px;margin:5px 0}
  .src code{color:var(--muted)}
  .log{display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:440px;overflow:auto}
  .le{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
  .le.warn{background:rgba(255,176,32,.12)}.le.err{background:rgba(255,90,90,.14)}.le.ok{background:rgba(18,198,165,.1)}
  .le time{color:var(--muted)}
  .loading{padding:60px;text-align:center;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--teal),var(--violet));
    color:#fff;padding:11px 20px;border-radius:12px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.28s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.45}
  @media (max-width:780px){.hero{grid-template-columns:1fr}.srow,.srcline{grid-template-columns:1fr}.aura{display:none}}

  /* --- Geräte-Store --- */
  .devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .dev{background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:var(--r-lg);padding:14px;position:relative;overflow:hidden;
    transition:transform .18s ease,box-shadow .3s}
  .dev:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .dev.off{opacity:.5}
  .dev::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.25))}
  .dev.active{box-shadow:0 0 0 1px rgba(18,198,165,.35),0 18px 44px rgba(18,198,165,.14)}
  .dev.active .dev-ico{animation:breath 2.6s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .dev-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .dev-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none;
    background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.12)}
  .dev-name{font-weight:700;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dev-type{font-size:11px;color:var(--muted)}
  .dev-state{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.09);white-space:nowrap}
  .dev-reason{font-size:12px;color:rgba(238,241,255,.82);margin:8px 0;line-height:1.38;min-height:32px}
  .dev-det{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .pill{font-size:11px;background:rgba(255,255,255,.07);padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
  .dev-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dev-acts button{padding:7px 11px;font-size:12px;border-radius:10px}
  .card-tile{cursor:pointer;text-align:left;position:relative;overflow:hidden}
  .card-tile:hover{border-color:rgba(18,198,165,.5);box-shadow:var(--shadow)}
  .card-tile .cico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;
    background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.12)}
  .store-cats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
  .store-cats button{padding:7px 12px;font-size:12.5px;border-radius:999px;background:rgba(255,255,255,.06)}
  .store-cats button.sel{background:linear-gradient(135deg,var(--amber),var(--coral));color:#241300;font-weight:600}
  .banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    background:linear-gradient(135deg,rgba(18,198,165,.16),rgba(123,92,255,.16));border:1px solid rgba(18,198,165,.3);
    border-radius:var(--r-lg);padding:16px 18px;margin-bottom:8px}
  .banner b{display:block;font-size:14.5px} .banner p{margin:3px 0 0;font-size:12.5px;color:rgba(238,241,255,.8)}
  .found{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
  .found .card{cursor:pointer}
  .conf{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(18,198,165,.22);color:#6ef2d6}
  .modal{position:fixed;inset:0;background:rgba(6,9,24,.72);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:50;padding:16px;
    animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal .box{width:min(700px,100%);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#151b40,#0b102e);
    border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);animation:pop .24s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal .mh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .role-row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin:8px 0}
  .role-row label{font-size:12.5px}.role-row .req{color:var(--coral);font-size:11px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .empty{padding:26px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-md);color:var(--muted)}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 2px}
  .emoji-pick button{font-size:19px;padding:6px 9px;border-radius:11px;background:rgba(255,255,255,.06);line-height:1}
  .emoji-pick button.sel{background:linear-gradient(135deg,var(--teal),var(--violet));box-shadow:0 6px 16px rgba(90,70,220,.4)}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="wrap" id="app"><div class="loading">SolarFlow lädt …</div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const T={
 de:{title:"SolarFlow",sub:"Wärme und Laden in die Sonne schieben – sicher.",

   rolePick:"– bitte wählen –",name:"Name",discover:"✨ Automatisch erkennen",save2:"Übernehmen",cancel:"Abbrechen",

function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2000);}

// Unter Home-Assistant-Ingress laeuft die Seite unter einem Unterpfad
// (z. B. /api/hassio_ingress/<token>/). Alle API-Aufrufe daher relativ zum
// aktuellen Pfad bilden, damit direkter Zugriff und Ingress beide funktionieren.
const BASE=location.pathname.endsWith("/")?location.pathname:location.pathname.replace(/[^/]*$/,"");
async function api(path,opts){
  try{const r=await fetch(BASE+path.replace(/^\//,""),Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
    if(!r.ok){throw new Error(await r.text());} return await r.json();}
  catch(e){toast(String(e.message||e));return null;}
}
async function refresh(){const s=await api("/api/snapshot"); if(s){SNAP=s; if(!DRAFT)DRAFT=Object.assign({},s.settings); render();}}
async function loadGroups(){const g=await api("/api/devices/registry");if(g)GROUPS=g;}

function statusLabel(st){return st==="blocked"?t("blocked"):st==="warn"?t("warn"):st==="active"?t("activeLayer"):t("ok");}
function devStateLabel(st){return t("st_"+st)||st;}
function nf(n,d){return n==null?"–":Number(n).toLocaleString(LANG==="de"?"de-DE":"en-US",{maximumFractionDigits:d==null?0:d});}
function accent(name){return ACC[name]||ACC.violet;}

function render(){

  $("#app").innerHTML=`<header>

        <button class="ghost" data-lang>${LANG.toUpperCase()}</button>
        <button class="danger ${s.emergency_stop?"pulse":""}" data-emg="${s.emergency_stop?0:1}">${s.emergency_stop?t("reset"):t("emergency")}</button>
      </div>
    </header>
    ${hero(s)}
    <nav class="tabs">${[["home",t("layers")],["flow",t("flow")],["store",t("store")],["settings",t("settings")],["sources",t("sources")],["log",t("log")]]
      .map(([id,l])=>`<button class="tab ${TAB===id?"sel":""}" data-tab="${id}">${l}</button>`).join("")}</nav>
    <div class="panel">${panel(s)}</div>

  wire();

function panel(s){
  switch(TAB){

    default: return home(s);
  }
}
function hero(s){

  const len=251, off=len-(len*Math.max(0,pct))/100;
  const modes=["off","shadow","active"].map(m=>`<button class="mode ${s.mode===m?"sel":""}" data-mode="${m}"><b>${t(m)}</b><small>${t(m+"Hint")}</small></button>`).join("");
  return `<section class="hero">
    <div class="gauge"><svg viewBox="0 0 200 120" role="img" aria-label="${t("feedin")}">
      <defs><linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffb020"/><stop offset="60%" stop-color="#ff6b4a"/><stop offset="100%" stop-color="#7b5cff"/>
      </linearGradient></defs>
      <path class="track" d="M20 110 A80 80 0 0 1 180 110"/>
      <path class="fill" d="M20 110 A80 80 0 0 1 180 110" style="stroke-dasharray:${len};stroke-dashoffset:${off}"/></svg>
      <div class="pulse-ring"></div>

      <div class="row"><span>${t("store")}</span><b>${(s.devices||[]).length}</b></div>
      <div class="why">${s.blocked?"🛡 ":"✅ "}${esc(s.reason_de||"")}</div>
      <div class="modes">${modes}</div>
    </div></section>`;
}
function home(s){
  const devs=(s.assessments||[]).map(a=>devCard(a)).join("")||`<div class="empty">${t("noDevices")}</div>`;
  const layers=(s.layers||[]).map(l=>`<div class="layer ${l.status}"><div class="idx">${l.idx}</div>

    <div class="ldet">${esc(LANG==="de"?l.detail_de:l.detail_en)}</div></div>`).join("");

}
function devCard(a){
  const det=Object.entries(a.details||{}).map(([k,v])=>`<span class="pill">${esc(k)}: ${esc(v)}</span>`).join("");
  return `<div class="dev ${a.active?"active":""} ${a.enabled?"":"off"}" style="--accent:${accent(a.accent)}">
    <div class="dev-head"><div class="dev-ico">${esc(a.emoji||"⚙️")}</div>
      <div style="flex:1;min-width:0"><div class="dev-name">${esc(a.name)}</div><div class="dev-type">${esc(a.type_id)}</div></div>

    <div class="dev-reason">${esc(LANG==="de"?a.reason_de:a.reason_en)}</div>
    <div class="dev-det">${det}</div></div>`;

function flow(s){
  const c=s.compare||{};
  const max=Math.max(1000, ...["pv_w","feed_in_w","grid_import_w"].map(k=>Math.abs(c[k]||0)), Math.abs(c.devices_w||0));
  const node=(icon,label,val,sub,color)=>{
    const w=Math.min(100,(Math.abs(val||0)/max)*100);
    return `<div class="fnode" style="--accent:${color}"><div class="fico">${icon}</div>
      <div><div style="font-size:13px">${label}</div><div class="fbar"><i style="width:${w}%"></i></div>
      <div class="fsub">${sub||""}</div></div>
      <div class="fval">${val!=null?nf(val)+" W":"–"}</div></div>`;
  };
  const devs=(c.devices||[]).map(d=>{
    const w=Math.min(100,Math.abs(d.power_w||0)/max*100);
    return `<div class="fnode" style="--accent:${accent(d.accent)}"><div class="fico">${esc(d.emoji||"⚙️")}</div>
      <div><div style="font-size:13px">${esc(d.name)}</div><div class="fbar"><i style="width:${w}%"></i></div>
      <div class="fsub">${devStateLabel(d.state)} · ${Math.round((d.share||0)*100)} % ${t("devicesW")}</div></div>
      <div class="fval">${nf(d.power_w)} W</div></div>`;
  }).join("");
  const su=c.self_use!=null?Math.round(c.self_use*100):0;
  const hasAny=c.pv_w!=null||c.feed_in_w!=null||c.grid_import_w!=null||devs;
  return `<h2>${t("flow")}</h2>
    <div class="flow">
      ${node("☀️",t("pv"),c.pv_w,"","#ffb020")}
      ${node("🔌",t("surplus"),c.feed_in_w,"","#12c6a5")}
      ${node("🏭",t("gridIn"),c.grid_import_w,"","#ff5d5d")}
      ${node("⚙️",t("devicesW"),c.devices_w,`${(c.devices||[]).length} ${t("store")}`,"#7b5cff")}
      ${devs?`<h2>${t("myDevices")}</h2>${devs}`:""}
      ${hasAny?`<div class="selfuse"><div class="ring" style="--p:${su}"><b>${su}%</b></div>
        <div><b>${t("selfUse")}</b><div class="hint" style="margin:2px 0 0">${t("flow")}: ${c.devices_w!=null?nf(c.devices_w):"–"} W / ${c.pv_w!=null?nf(c.pv_w):"–"} W</div></div></div>`
        :`<div class="empty">${t("noFlow")}</div>`}
    </div>`;
}
function store(s){
  const mine=(s.devices||[]).map(d=>{
    const a=(s.assessments||[]).find(x=>x.device_id===d.id);
    const roles=Object.entries(d.roles||{}).map(([k,v])=>`<div class="src"><span>${esc(k)}</span><code>${esc(v)}</code></div>`).join("")||`<div class="src"><span>–</span><code>–</code></div>`;

  return `<div class="banner"><div><b>✨ ${t("autoTitle")}</b><p>${t("autoText")}</p></div>

    <h2>${t("myDevices")} <span class="cnt">${(s.devices||[]).length}</span></h2><div class="devices">${mine}</div>

function foundBox(){
  if(!FOUND||!FOUND.length)return `<div class="empty">${t("foundNone")}</div>`;
  const cards=FOUND.map((f,i)=>`<div class="card card-tile" data-foundidx="${i}" style="--accent:${accent("teal")}">

    <div class="cbody"><div class="ctitle">${esc(f.device_name||f.name)} <span class="conf">${Math.round(f.confidence*100)} %</span></div>
      <div class="csum">${esc(typeName(f.type_id))}${f.area?" · "+esc(f.area):""}</div>

function typeName(id){const x=(SNAP.device_types||[]).find(y=>y.type_id===id);return x?(LANG==="de"?x.name_de:x.name_en):id;}
function settings(s){
  const d=DRAFT||s.settings;
  const row=(k,l,mn,mx,st)=>`<div class="srow"><label>${l}</label>
    <input type="range" data-range="${k}" min="${mn}" max="${mx}" step="${st}" value="${d[k]}"/><output data-out="${k}">${d[k]}</output></div>`;
  const chk=(k,l)=>`<div class="srow"><label>${l}</label>
    <label class="sw"><input type="checkbox" data-check="${k}" ${d[k]?"checked":""}/><span></span></label>
    <output data-out="${k}">${d[k]?"✓":"–"}</output></div>`;
  const grp=(title,body)=>`<section class="sgroup"><h3>${title}</h3>${body}</section>`;
  return `<h2>${t("settings")}</h2>
    ${grp(t("grpBase"),row("feed_in_on_w",t("feedOn"),0,20000,50)+row("feed_in_off_w",t("feedOff"),0,20000,50)+row("min_runtime_min",t("minRun"),0,720,1)+row("min_pause_min",t("minPause"),0,720,1))}

    ${grp(t("grpSafety"),row("sensor_max_age_s",t("maxAge"),10,3600,10)+row("max_grid_import_w",t("maxGrid"),1000,60000,100)+chk("verify_writes",t("verify")))}
    <button class="primary" data-save>${t("save")}</button>`;
}
function sources(s){
  const specs=s.source_specs||{};
  const rows=Object.keys(specs).map(k=>{
    const spec=specs[k]; const cur=(s.sources||{})[k]||"";
    const domains=spec.domains||[];
    const opts=(CATALOG||[]).filter(e=>domains.length===0||domains.includes(e.domain));
    return `<div class="srcline"><label>${esc(spec.label)}</label><select data-src="${k}">
      <option value="">${t("pick")}</option>
      ${opts.map(e=>`<option value="${e.entity_id}" ${e.entity_id===cur?"selected":""}>${esc(e.entity_id)} — ${esc(e.name)}</option>`).join("")}
    </select></div>`;}).join("");
  const src=Object.entries(s.sources||{}).map(([k,v])=>`<div class="src"><span>${esc(k)}</span><code>${esc(v||"–")}</code></div>`).join("");
  return `<h2>${t("sources")}</h2><p class="hint">${t("srcHint")}</p>
    <button class="ghost" data-detect>✨ ${t("detect")}</button>
    <div style="margin-top:12px">${rows}</div>
    <button class="primary" data-savesrc>${t("save")}</button>
    <h2>${t("sources")}</h2><div>${src}</div>`;
}
function log(s){
  const rows=(s.audit||[]).map(e=>`<div class="le ${e.level}"><time>${esc(e.t)}</time><span>${esc(e.text)}</span></div>`).join("")||`<div class="le"><time></time><span>${t("logEmpty")}</span></div>`;

function groupByKey(key){return (GROUPS||[]).find(g=>g.key===key);}

function emojiPicker(current){

function editModal(s){
  const spec=(s.device_types||[]).find(x=>x.type_id===EDIT.type_id)||{roles:[],settings:[],name_de:EDIT.type_id};
  const nameVal=EDIT.name||(LANG==="de"?spec.name_de:spec.name_en);
  const curEmoji=EDIT.emoji||spec.emoji||"🧩";
  const groups=GROUPS||[];
  const groupSel=`<div class="srow"><label>${t("fromDevice")}</label>
    <select data-dgroup><option value="">${t("allEntities")}</option>
      ${groups.map(g=>`<option value="${g.key}" ${EDIT.device_key===g.key?"selected":""}>${esc(g.name)}${g.area?" · "+esc(g.area):""} (${g.entity_count})</option>`).join("")}
    </select></div>`;
  const pool=entityPool();
  const roleRows=(spec.roles||[]).map(r=>{
    const cur=(EDIT.roles||{})[r.key]||"";
    const opts=pool.filter(e=>(r.domains||[]).length===0||(r.domains||[]).includes(e.domain));
    const extra=cur&&!opts.some(e=>e.entity_id===cur)?`<option value="${cur}" selected>${esc(cur)}</option>`:"";
    return `<div class="role-row"><label>${esc(LANG==="de"?r.label_de:r.label_en)}${r.required?` <span class="req">(${t("req")})</span>`:""}</label>
      <select data-role="${r.key}"><option value="">${t("rolePick")}</option>${extra}
        ${opts.map(e=>`<option value="${e.entity_id}" ${e.entity_id===cur?"selected":""}>${esc(e.entity_id)} — ${esc(e.name)}</option>`).join("")}
      </select></div>`;
  }).join("");
  const setRows=(spec.settings||[]).map(x=>{
    const val=(EDIT.settings&&EDIT.settings[x.key]!=null)?EDIT.settings[x.key]:x.default;
    return `<div class="srow"><label>${esc(LANG==="de"?x.label_de:x.label_en)}</label>
      <input type="range" data-dset="${x.key}" min="${x.min}" max="${x.max}" step="${x.step}" value="${val}"/>
      <output data-dout="${x.key}">${val}${x.unit?" "+x.unit:""}</output></div>`;
  }).join("");
  return `<div class="modal" data-modal><div class="box">
    <div class="mh"><div class="dev-ico" id="modalIco">${esc(curEmoji)}</div><div><h3>${esc(LANG==="de"?spec.name_de:spec.name_en)}</h3>
      <div class="dev-type">${esc(LANG==="de"?spec.summary_de:spec.summary_en)}</div></div></div>
    ${groupSel}
    <div class="srow"><label>${t("name")}</label><input type="text" data-dname value="${esc(nameVal)}"/></div>
    <div class="srow" style="align-items:start"><label>${t("emoji")}</label><div style="grid-column:2/4">${emojiPicker(curEmoji)}</div></div>
    <button class="ghost" data-ddiscover>${t("discover")}</button>
    <div style="margin-top:10px">${roleRows}</div>
    ${setRows?`<h2>${t("settings")}</h2>${setRows}`:""}
    <div class="modal-foot"><button class="ghost" data-dcancel>${t("cancel")}</button>
      <button class="primary" style="margin:0" data-dsave>${t("save2")}</button></div>
  </div></div>`;
}

function wire(){
  document.querySelectorAll("[data-mode]").forEach(el=>el.onclick=async()=>{const r=await api("/api/mode",{method:"POST",body:JSON.stringify({mode:el.dataset.mode})});if(r){SNAP=r;render();}});
  document.querySelectorAll("[data-emg]").forEach(el=>el.onclick=async()=>{const r=await api("/api/emergency",{method:"POST",body:JSON.stringify({on:el.dataset.emg==="1"})});if(r){SNAP=r;render();}});
  document.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>{TAB=el.dataset.tab;if((TAB==="sources"||TAB==="store")&&!CATALOG)loadCatalog();if(TAB==="store")loadGroups();render();});
  const lang=document.querySelector("[data-lang]");if(lang)lang.onclick=()=>{LANG=LANG==="de"?"en":"de";localStorage.setItem("sf_lang",LANG);render();};
  const save=document.querySelector("[data-save]");if(save)save.onclick=saveSettings;
  document.querySelectorAll("input[data-range]").forEach(el=>el.oninput=()=>{DRAFT=Object.assign({},DRAFT,{[el.dataset.range]:Number(el.value)});const o=document.querySelector(`output[data-out="${el.dataset.range}"]`);if(o)o.textContent=el.value;});
  document.querySelectorAll("input[data-check]").forEach(el=>el.onchange=()=>{DRAFT=Object.assign({},DRAFT,{[el.dataset.check]:el.checked});const o=document.querySelector(`output[data-out="${el.dataset.check}"]`);if(o)o.textContent=el.checked?"✓":"–";});
  const det=document.querySelector("[data-detect]");if(det)det.onclick=detectSources;
  const ssrc=document.querySelector("[data-savesrc]");if(ssrc)ssrc.onclick=saveSources;

  // --- Store ---
  document.querySelectorAll("[data-cat]").forEach(el=>el.onclick=()=>{STORE_CAT=el.dataset.cat;render();});
  document.querySelectorAll("[data-addtype]").forEach(el=>el.onclick=()=>openAdd(el.dataset.addtype));
  document.querySelectorAll("[data-devedit]").forEach(el=>el.onclick=()=>openEdit(el.dataset.devedit));
  document.querySelectorAll("[data-devdel]").forEach(el=>el.onclick=()=>removeDevice(el.dataset.devdel));
  document.querySelectorAll("input[data-deven]").forEach(el=>el.onchange=async()=>{
    const r=await api("/api/device/update",{method:"POST",body:JSON.stringify({id:el.dataset.deven,enabled:el.checked})});if(r){SNAP=r;render();}});
  const scan=document.querySelector("[data-autoscan]");if(scan)scan.onclick=autoScan;
  const addAll=document.querySelector("[data-autoaddall]");if(addAll)addAll.onclick=autoAddAll;
  document.querySelectorAll("[data-foundidx]").forEach(el=>el.onclick=()=>openFound(Number(el.dataset.foundidx)));

  // --- Modal ---
  const cancel=document.querySelector("[data-dcancel]");if(cancel)cancel.onclick=()=>{EDIT=null;render();};
  const m=document.querySelector("[data-modal]");if(m)m.onclick=e=>{if(e.target===m){EDIT=null;render();}};
  const dsc=document.querySelector("[data-ddiscover]");if(dsc)dsc.onclick=discoverRoles;
  const dsv=document.querySelector("[data-dsave]");if(dsv)dsv.onclick=saveDevice;
  const dgrp=document.querySelector("[data-dgroup]");if(dgrp)dgrp.onchange=()=>{EDIT.device_key=dgrp.value;render();};
  document.querySelectorAll("[data-emoji]").forEach(el=>el.onclick=()=>{EDIT.emoji=el.dataset.emoji;
    document.querySelectorAll("[data-emoji]").forEach(x=>x.classList.toggle("sel",x.dataset.emoji===EDIT.emoji));
    const ico=document.querySelector("#modalIco");if(ico)ico.textContent=EDIT.emoji;});
  document.querySelectorAll("input[data-dset]").forEach(el=>el.oninput=()=>{
    EDIT.settings=Object.assign({},EDIT.settings,{[el.dataset.dset]:Number(el.value)});
    const o=document.querySelector(`output[data-dout="${el.dataset.dset}"]`);if(o)o.textContent=el.value;});
}
async function saveSettings(){const r=await api("/api/settings",{method:"POST",body:JSON.stringify({settings:DRAFT})});
  if(r){SNAP=r.snapshot;DRAFT=Object.assign({},r.snapshot.settings);render();toast(t("saved"));}}
async function loadCatalog(){CATALOG=await api("/api/entities")||[];}
async function detectSources(){
  const sug=await api("/api/suggest")||[];
  const map={};sug.forEach(x=>{if(x.entity_id)map[x.role]=x.entity_id;});
  await api("/api/sources",{method:"POST",body:JSON.stringify({sources:map})});
  await refresh();toast(t("detect"));render();
}
async function saveSources(){
  const map={};document.querySelectorAll("[data-src]").forEach(el=>{map[el.dataset.src]=el.value;});
  const r=await api("/api/sources",{method:"POST",body:JSON.stringify({sources:map})});
  if(r){SNAP=r;toast(t("savedSrc"));render();}
}
async function autoScan(){
  SCANNING=true;render();
  const found=await api("/api/devices/auto");
  FOUND=Array.isArray(found)?found:[];
  SCANNING=false;render();
}
async function autoAddAll(){
  const r=await api("/api/devices/auto",{method:"POST",body:JSON.stringify({})});
  if(r&&r.snapshot){SNAP=r.snapshot;FOUND=[];toast(r.added+" "+t("autoAdded"));render();}
}
async function openAdd(typeId){
  if(!CATALOG)await loadCatalog();
  if(!GROUPS.length)await loadGroups();
  const spec=(SNAP.device_types||[]).find(x=>x.type_id===typeId)||{};
  EDIT={mode:"add",type_id:typeId,name:LANG==="de"?spec.name_de:spec.name_en,roles:{},settings:{},emoji:spec.emoji||""};
  render();
}
function openEdit(id){
  const d=(SNAP.devices||[]).find(x=>x.id===id);if(!d)return;
  EDIT={mode:"edit",id:d.id,type_id:d.type_id,name:d.name,roles:Object.assign({},d.roles),settings:Object.assign({},d.settings),emoji:d.emoji||""};
  if(!CATALOG)loadCatalog();
  if(!GROUPS.length)loadGroups();
  render();
}
function openFound(idx){
  const f=(FOUND||[])[idx];if(!f)return;
  EDIT={mode:"add",type_id:f.type_id,name:f.device_name||f.name,roles:Object.assign({},f.roles),settings:{},device_key:f.device_key||"",emoji:""};
  if(!CATALOG)loadCatalog();
  render();
}
async function discoverRoles(){
  const roles={};document.querySelectorAll("[data-role]").forEach(el=>{if(el.value)roles[el.dataset.role]=el.value;});
  const name=document.querySelector("[data-dname]")?.value||"";
  const r=await api("/api/device/discover",{method:"POST",body:JSON.stringify({type_id:EDIT.type_id,name,device_key:EDIT.device_key||""})});
  if(r&&r.roles){Object.entries(r.roles).forEach(([k,v])=>{if(v)roles[k]=v;});EDIT.roles=roles;render();toast(t("detect"));}
}
async function saveDevice(){
  const name=document.querySelector("[data-dname]")?.value||"";
  const roles={};document.querySelectorAll("[data-role]").forEach(el=>{if(el.value)roles[el.dataset.role]=el.value;});
  let r;
  if(EDIT.mode==="add"){
    r=await api("/api/devices",{method:"POST",body:JSON.stringify({type_id:EDIT.type_id,name,roles,emoji:EDIT.emoji||""})});
  }else{
    r=await api("/api/device/update",{method:"POST",body:JSON.stringify({id:EDIT.id,name,roles,settings:EDIT.settings||{},emoji:EDIT.emoji||""})});
  }
  if(r){SNAP=r;EDIT=null;toast(t("saved"));render();}
}
async function removeDevice(id){
  if(!confirm(t("removeQ")))return;
  const r=await api("/api/device/remove",{method:"POST",body:JSON.stringify({id})});
  if(r){SNAP=r;toast(t("remove"));render();}
}
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
