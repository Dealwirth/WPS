name: "SolarFlow"
version: "2.0.0"
slug: "solarflow"
description: "Sichere PV-Ueberschuss-Automatik mit Geräte-Store fuer Waermepumpe, Wallbox, Speicher und mehr"
url: "https://github.com/Dealwirth/WPS"
arch:
  - aarch64
  - amd64
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: "mdi:solar-power"
panel_title: "SolarFlow"
panel_admin: false
host_network: false
map:
  - config:rw
startup: "application"
boot: "auto"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
